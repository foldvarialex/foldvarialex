name: Activity card

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Render activity card
        run: node scripts/activity.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render experience timeline
        run: node scripts/timeline.mjs

      - name: Publish the cards to the output branch
        run: |
          mkdir -p "$RUNNER_TEMP/cards"
          cp assets/activity-dark.svg assets/activity-light.svg assets/timeline-dark.svg assets/timeline-light.svg "$RUNNER_TEMP/cards/"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout --quiet --orphan output
          git rm -rfq .
          cp "$RUNNER_TEMP/cards/"*.svg .
          git add activity-dark.svg activity-light.svg timeline-dark.svg timeline-light.svg
          git commit -qm "Update activity card and timeline"
          git push --quiet --force origin output
