name: Profile cards

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Prepare
        run: mkdir -p "$RUNNER_TEMP/new"

      - name: Render activity card
        id: activity
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/activity.mjs
          cp assets/activity-dark.svg assets/activity-light.svg "$RUNNER_TEMP/new/"

      - name: Render experience timeline
        id: timeline
        continue-on-error: true
        env:
          TIMELINE_OUT: ${{ runner.temp }}/new
        run: node scripts/timeline.mjs

      - name: Render languages card
        id: languages
        continue-on-error: true
        env:
          LANGS_TOKEN: ${{ secrets.LANGS_TOKEN }}
          CARDS_OUT: ${{ runner.temp }}/new
        run: node scripts/languages.mjs

      - name: Publish the cards to the output branch
        run: |
          shopt -s nullglob
          fresh=("$RUNNER_TEMP"/new/*.svg)
          if [ ${#fresh[@]} -eq 0 ]; then
            echo "No card was rendered, the output branch stays as it is"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/cards"
          if git fetch --quiet --depth 1 origin output; then
            for card in activity-dark activity-light timeline-dark timeline-light languages-dark languages-light; do
              git show "FETCH_HEAD:$card.svg" > "$RUNNER_TEMP/cards/$card.svg" 2>/dev/null || rm -f "$RUNNER_TEMP/cards/$card.svg"
            done
          fi
          cp "${fresh[@]}" "$RUNNER_TEMP/cards/"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout --quiet --orphan output
          git rm -rfq .
          cp "$RUNNER_TEMP/cards/"*.svg .
          git add -- *.svg
          git commit -qm "Update profile cards"
          git push --quiet --force origin output

      - name: Flag cards that kept their previous version
        if: always()
        env:
          OUTCOMES: ${{ steps.activity.outcome }} ${{ steps.timeline.outcome }} ${{ steps.languages.outcome }}
        run: |
          case " $OUTCOMES " in
            *" failure "*)
              echo "::warning::At least one card was not rendered and keeps its previous version ($OUTCOMES)"
              exit 1
              ;;
          esac
